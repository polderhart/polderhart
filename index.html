<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>'t Polderhart - Gemeentelijke basisschool in Zuienkerke</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="assets/logo.png">

    <!-- CSS -->
    <link rel="stylesheet" href="css/main.css">

    <!-- 🔑 Netlify Identity MOET in head -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>

<body>

    <!-- NAV -->
    <nav class="nav">
        <div class="nav__container">
            <a href="index.html" class="nav__logo">
                <img src="assets/logo.png" alt="logo">
            </a>

            <ul class="nav__menu">
                <li><a href="index.html">Welkom</a></li>
                <li><a href="onze-school.html">Onze school</a></li>
                <li><a href="praktisch.html">Praktisch</a></li>
                <li><a href="team.html">Team</a></li>
                <li><a href="agenda.html">Agenda</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </div>
    </nav>

    <!-- HERO -->
    <section class="hero">
        <div class="hero__container">
            <div>
                <p>Gemeentelijke Basisschool in Zuienkerke</p>
                <h1>'t Polderhart</h1>
                <p>
                    Waar elk kind mag groeien, leren en spelen in een veilige omgeving.
                </p>
            </div>

            <div>
                <img src="assets/hero-image.jpg" alt="klas">
            </div>
        </div>
    </section>

    <!-- FOOTER -->
    <footer>
        <p>© 2026 't Polderhart</p>
    </footer>

    <!-- JS -->
    <script src="js/app.js"></script>

    <!-- 🔑 Identity login redirect -->
    <script>
        if (window.netlifyIdentity) {

            window.netlifyIdentity.on("init", user => {
                // 👉 Dit fixeert invite + recovery tokens
                if (!user && window.location.hash.includes("token")) {
                    window.netlifyIdentity.open();
                }
            });

            window.netlifyIdentity.on("login", () => {
                document.location.href = "/admin/";
            });
        }
    </script>

</body>

</html>
