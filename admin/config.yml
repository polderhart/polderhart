          - { label: "Stap 5 – titel", name: "step5_title", widget: "string" }
          - { label: "Stap 5 – beschrijving", name: "step5_description", widget: "text" }
          - { label: "Stap 5 – foto", name: "step5_image", widget: "image", required: false }
          - { label: "Wanneer inschrijven – label", name: "timing_label", widget: "string" }
          - { label: "Wanneer inschrijven – titel", name: "timing_title", widget: "string" }
          - { label: "Wanneer inschrijven – schooljaar", name: "timing_schooljaar", widget: "text" }
          - { label: "Wanneer inschrijven – zomervakantie", name: "timing_zomer", widget: "text" }
          - { label: "Wanneer inschrijven – foto", name: "timing_image", widget: "image", required: false }
          - { label: "Documenten – label", name: "docs_label", widget: "string" }
          - { label: "Documenten – titel", name: "docs_title", widget: "string" }
          - { label: "Documenten – intro", name: "docs_intro", widget: "string" }
          - { label: "Documenten – foto", name: "docs_image", widget: "image", required: false }
          - { label: "Leeftijd – label", name: "age_label", widget: "string" }
          - { label: "Leeftijd – titel", name: "age_title", widget: "string" }
          - { label: "Leeftijd – beschrijving", name: "age_description", widget: "text" }
          - { label: "Leeftijd – foto", name: "age_image", widget: "image", required: false }

      - label: "Schoolbus"
        name: "schoolbus"
        file: "content/pages/schoolbus.json"
        media_folder: "/assets/docu"
        public_folder: "/assets/docu"
        fields:
          - { label: "Hero – titel", name: "hero_title", widget: "string" }
          - { label: "Hero – ondertitel", name: "hero_subtitle", widget: "string" }
          - { label: "Intro – beschrijving", name: "intro_description", widget: "text" }
          - { label: "Tarieven – titel", name: "tarieven_title", widget: "string" }
          - { label: "Tarieven – intro", name: "tarieven_intro", widget: "text" }
          - { label: "Tarieven – kleuters", name: "tarieven_kleuters", widget: "text" }
          - { label: "Tarieven – lager", name: "tarieven_lager", widget: "text" }
