              - { label: "Beschrijving", name: "description", widget: "text" }
              - { label: "Foto", name: "image", widget: "image", required: false }
              - { label: "Foto alt-tekst", name: "image_alt", widget: "string", required: false }
          - label: "Dagindeling – stap 5 (Einde schooldag)"
            name: "timeline_5"
            widget: "object"
            fields:
              - { label: "Titel", name: "title", widget: "string" }
              - { label: "Beschrijving", name: "description", widget: "text" }
              - { label: "Foto", name: "image", widget: "image", required: false }
              - { label: "Foto alt-tekst", name: "image_alt", widget: "string", required: false }
          - { label: "Infrastructuur – label", name: "infra_label", widget: "string" }
          - { label: "Infrastructuur – titel", name: "infra_title", widget: "string" }
          - { label: "Infrastructuur – beschrijving", name: "infra_description", widget: "text" }
          - { label: "Infrastructuur – foto", name: "infra_image", widget: "image", required: false }
          - { label: "Infrastructuur – foto alt-tekst", name: "infra_image_alt", widget: "string", required: false }
          - { label: "Speelplaats – label", name: "playground_label", widget: "string" }
          - { label: "Speelplaats – titel", name: "playground_title", widget: "string" }
          - { label: "Speelplaats – beschrijving", name: "playground_description", widget: "text" }
          - { label: "Speelplaats – foto", name: "playground_image", widget: "image", required: false }
          - { label: "Speelplaats – foto alt-tekst", name: "playground_image_alt", widget: "string", required: false }
          - { label: "Turnzaal – label", name: "sport_label", widget: "string" }
          - { label: "Turnzaal – titel", name: "sport_title", widget: "string" }
          - { label: "Turnzaal – beschrijving", name: "sport_description", widget: "text" }
          - { label: "Turnzaal – foto", name: "sport_image", widget: "image", required: false }
          - { label: "Turnzaal – foto alt-tekst", name: "sport_image_alt", widget: "string", required: false }
          - { label: "Waarom – sectietitel", name: "why_title", widget: "string" }
          - { label: "Waarom – sectieondertitel", name: "why_subtitle", widget: "string" }
          - { label: "Waarom 1 – titel", name: "why_1_title", widget: "string" }
          - { label: "Waarom 1 – beschrijving", name: "why_1_description", widget: "text" }
          - { label: "Waarom 2 – titel", name: "why_2_title", widget: "string" }
          - { label: "Waarom 2 – beschrijving", name: "why_2_description", widget: "text" }
          - { label: "Waarom 3 – titel", name: "why_3_title", widget: "string" }
          - { label: "Waarom 3 – beschrijving", name: "why_3_description", widget: "text" }
          - { label: "Waarom 4 – titel", name: "why_4_title", widget: "string" }
          - { label: "Waarom 4 – beschrijving", name: "why_4_description", widget: "text" }
          - { label: "Waarom 5 – titel", name: "why_5_title", widget: "string" }
          - { label: "Waarom 5 – beschrijving", name: "why_5_description", widget: "text" }
          - { label: "CTA – titel", name: "cta_title", widget: "string" }
          - { label: "CTA – beschrijving", name: "cta_description", widget: "text" }

      - label: "Contact"
        name: "contact"
        file: "content/pages/contact.json"
        fields:
          - { label: "Hero – titel", name: "hero_title", widget: "string" }
          - { label: "Hero – ondertitel", name: "hero_subtitle", widget: "string" }
          - { label: "Locatie – beschrijving 1", name: "location_description", widget: "text" }
          - { label: "Locatie – beschrijving 2 (schooltuin)", name: "location_description_2", widget: "text" }
          - { label: "Locatie – beschrijving 3 (zitbokken)", name: "location_description_3", widget: "text" }
          - { label: "Bereikbaarheid – intro", name: "bereikbaarheid_description", widget: "text" }
