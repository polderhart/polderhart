          - { label: "Intro – foto alt-tekst", name: "intro_image_alt", widget: "string", required: false }
          - { label: "Intro – label", name: "intro_label", widget: "string" }
          - { label: "Intro – titel", name: "intro_title", widget: "string" }
          - { label: "Intro – alinea 1", name: "intro_description_1", widget: "text" }
