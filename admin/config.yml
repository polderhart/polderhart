          - { label: "Naschoolse opvang – titel", name: "na_title", widget: "string" }
          - { label: "Naschoolse opvang – uren (van)", name: "na_hours_start", widget: "string" }
          - { label: "Naschoolse opvang – uren (tot)", name: "na_hours_end", widget: "string" }
          - { label: "Naschoolse opvang – extra info", name: "na_extra", widget: "text" }
          - { label: "Studiebegeleiding – titel", name: "studie_title", widget: "string" }
          - { label: "Studiebegeleiding – beschrijving", name: "studie_description", widget: "text" }
          - { label: "Studiebegeleiding – uren", name: "studie_hours", widget: "string" }

      - label: "Inschrijven"
        name: "inschrijvingen"
        file: "content/pages/inschrijvingen.json"
        media_folder: "/assets/pictures"
        public_folder: "/assets/pictures"
        fields:
          - { label: "Hero – titel", name: "hero_title", widget: "string" }
          - { label: "Hero – ondertitel", name: "hero_subtitle", widget: "string" }
